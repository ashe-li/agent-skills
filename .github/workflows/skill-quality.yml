name: Skill Quality Gate
on:
  pull_request:
    # */fixtures/** 與 check_release_fixtures.py 必須列進來：只改 fixture 不改
    # SKILL.md 時，舊的單一 glob 不會觸發，golden set 等於沒有守衛。
    # 同構前例見 KB `an-existing-guard-that-always-passes-may-just-not-cover-you`。
    paths:
      - "*/SKILL.md"
      - "*/fixtures/**"
      - "scripts/check_skill.py"
      - "scripts/check_release_fixtures.py"
      # scripts/tests/ 的 unittest 守的是 scripts/ 底下全部程式（plan_runner
      # 與其 sibling 模組、hooks），只列上面兩支 check 腳本會讓改 runner 的
      # PR 完全不觸發測試。workflow 自身也列進來，改 CI 時要能看到它跑。
      - "scripts/**"
      - ".github/workflows/skill-quality.yml"
jobs:
  unit-tests:
    # 在這之前 scripts/tests/ 從沒在 CI 跑過（CHANGELOG 舊條目已記錄），
    # 幾百個測試都不擋 merge。repo 只用 stdlib unittest，不需要 pytest。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Run scripts/tests
        run: python -m unittest discover scripts/tests
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Detect changed skills
        id: changed
        run: |
          ALL=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^[^/]+/SKILL\.md$' || true)
          NEW=$(git diff --diff-filter=A --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^[^/]+/SKILL\.md$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$ALL" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "new_files<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run quality check
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          NEW_FILES: ${{ steps.changed.outputs.new_files }}
        run: |
          ARGS=""
          for f in $CHANGED_FILES; do
            ARGS="$ARGS $f"
          done
          CMD="python scripts/check_skill.py --files $ARGS --repo-dir ."
          if [ -n "$NEW_FILES" ]; then
            NEW_ARGS=""
            for f in $NEW_FILES; do
              NEW_ARGS="$NEW_ARGS $f"
            done
            CMD="$CMD --new-files $NEW_ARGS"
          fi
          $CMD
      - name: Golden set gate self-test
        # 先證明這道守衛真的會擋，再拿它去擋別人。
        # KB `an-existing-guard-that-always-passes-may-just-not-cover-you`：
        # 守衛每次都通過，可能不是沒問題，是沒守到。
        run: python scripts/check_release_fixtures.py --self-test
      - name: Golden set completeness gate
        run: |
          python scripts/check_release_fixtures.py \
            --repo-dir . \
            --base-ref origin/${{ github.base_ref }}
